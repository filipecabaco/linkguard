<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkGuard</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 360px; max-width: 100%; background: var(--label); font-size: 15px; }
  .band { min-height: 52px; padding: 0 18px; }
  .state { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .switch { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: #1C223855; position: relative; cursor: pointer; margin: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #F6F5F1; transition: transform 160ms ease-out; }
  .switch:checked { background: var(--on-kraft); }
  .switch:checked::after { transform: translateX(14px); background: var(--kraft); box-shadow: inset 0 0 0 2px var(--on-kraft); }
  @media (prefers-color-scheme: light) { .switch:checked::after { background: #F6F5F1; box-shadow: none; } }
  .switch:focus-visible { outline: 3px solid var(--on-kraft); outline-offset: 2px; }
  .summary { padding: 18px 18px 14px; border-bottom: 1px solid var(--rule); }
  .summary h1 { font-size: 28px; }
  .summary p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
  .summary.ok h1 { color: var(--ok); }
  ul { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
  li { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top b { font-size: 15px; line-height: 1.3; }
  .top .stamp { flex: none; }
  .u { font: 12.5px/1.4 var(--mono); color: var(--ink); word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .r { color: var(--ink-2); font-size: 13px; line-height: 1.4; }
  .more { padding: 10px 18px; color: var(--ink-2); font-size: 13px; }
  .smart { padding: 12px 18px; border-bottom: 1px solid var(--rule); font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .smart a, .smart button { font-size: 13.5px; padding: 0; }
  footer { display: flex; align-items: center; gap: 4px 16px; flex-wrap: wrap; padding: 10px 18px 14px; }
  footer .btn { min-height: 38px; padding: 0 16px; font-size: 14px; }
  footer .push { margin-left: auto; }
</style></head>
<body>
  <header class="band">
    <svg class="mark" viewBox="0 0 30 34" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 2 3 6.5v9.2C3 24 8.6 29.6 15 32c6.4-2.4 12-8 12-16.3V6.5L15 2Z"/><path d="M9 17.5l4 4 8-9"/></svg>
    <span class="brand">LinkGuard</span>
    <label class="state"><span id="stateText">On</span><input type="checkbox" class="switch" id="enabled" checked aria-label="LinkGuard protection"></label>
  </header>
  <div class="summary" id="summary" aria-live="polite">
    <h1 class="display" id="headline">Checking…</h1>
    <p id="sub"></p>
    <button class="btn" id="allow" hidden style="margin-top:12px">Let LinkGuard check websites</button>
  </div>
  <ul id="list"></ul>
  <div class="smart" id="smart" hidden></div>
  <footer>
    <button class="btn secondary" id="rescan">Check again</button>
    <button class="quiet" id="trust" hidden>Trust this site</button>
    <a class="quiet push" href="options.html" target="_blank">Settings</a>
  </footer>
  <script src="analyzer.js"></script>
  <script src="popup.js"></script>
</body></html>
