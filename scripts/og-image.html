<!doctype html>
<!-- Source for docs/og-image.png, the 1200×630 card shown when the site is shared. Render with: npm run og-image -->
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "LG Archivo"; src: url("../fonts/archivo-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  :root {
    --kraft: #B48A5C; --on-kraft: #1C2238; --label: #F6F5F1; --ground: #E9E4DA;
    --ink: #1C2238; --ink-2: #4A5068; --rule: #1C223833;
    --stamp: #E2382B; --stamp-text: #C1261B; --stamp-wash: #E2382B1F;
    --display: "LG Archivo", "Arial Narrow", sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--label); color: var(--ink); font-family: var(--body); display: flex; flex-direction: column; }
  .band { height: 92px; flex: none; background: var(--kraft); color: var(--on-kraft); display: flex; align-items: center; gap: 16px; padding: 0 64px; }
  .band svg { width: 34px; height: 39px; }
  .band b { font: 800 30px/1 var(--display); font-stretch: 80%; letter-spacing: .05em; text-transform: uppercase; }
  .band span { margin-left: auto; font: 600 24px/1 var(--body); }
  main { flex: 1; padding: 52px 64px 0; position: relative; }
  h1 { margin: 0; font: 800 132px/.92 var(--display); font-stretch: 72%; letter-spacing: -.015em; }
  .lede { margin: 20px 0 0; font-size: 30px; line-height: 1.3; color: var(--ink-2); max-width: 24ch; text-wrap: balance; }
  .addr { position: absolute; right: 64px; bottom: 64px; width: 600px; border: 2px solid var(--ink); border-radius: 3px; padding: 22px 26px; background: var(--label); }
  .caps { font: 700 17px/1.2 var(--display); font-stretch: 88%; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-2); }
  .url { margin-top: 10px; font: 500 23px/1.35 var(--mono); white-space: nowrap; }
  .said { margin-top: 12px; font-size: 20px; color: var(--ink-2); }
  .url mark { background: var(--stamp-wash); color: var(--stamp-text); font-weight: 700; padding: 0 3px; border-radius: 2px; }
  .stamp { position: absolute; right: -26px; top: -78px; transform: rotate(-9deg); border: 7px double var(--stamp); color: var(--stamp-text); background: var(--label);
    border-radius: 8px; padding: .16em .42em .08em; font: 900 58px/1 var(--display); font-stretch: 68%; letter-spacing: .06em; text-transform: uppercase; }
</style></head>
<body>
  <header class="band">
    <svg viewBox="0 0 30 34" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 2 3 6.5v9.2C3 24 8.6 29.6 15 32c6.4-2.4 12-8 12-16.3V6.5L15 2Z"/><path d="M9 17.5l4 4 8-9"/></svg>
    <b>LinkGuard</b>
    <span>Free browser add-on</span>
  </header>
  <main>
    <h1>Is this<br>link safe?</h1>
    <p class="lede">Marks risky links and stops dangerous sites before they open.</p>
    <div class="addr">
      <div class="caps">It really goes to</div>
      <div class="url">http://<mark>paypa1-account-verify.xyz</mark>/login</div>
      <div class="said">The link said www.paypal.com</div>
      <div class="stamp">Not safe</div>
    </div>
  </main>
</body></html>
