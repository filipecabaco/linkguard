<!doctype html>
<!-- Source for docs/og-image.png, the 1200×630 card shown when the site is shared. Render with: npm run og-image
     Everything that matters sits in the centre 630×630 square: Slack and others crop the card to a square thumbnail. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "LG Archivo"; src: url("../fonts/archivo-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  :root {
    --kraft: #B48A5C; --on-kraft: #1C2238; --label: #F6F5F1; --ground: #E9E4DA;
    --ink: #1C2238; --ink-2: #4A5068; --rule: #1C223833;
    --stamp: #E2382B; --stamp-text: #C1261B; --stamp-wash: #E2382B1F;
    --display: "LG Archivo", "Arial Narrow", sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--label); color: var(--ink); font-family: var(--body); display: flex; flex-direction: column; }
  .band { height: 96px; flex: none; background: var(--kraft); color: var(--on-kraft); display: flex; align-items: center; justify-content: center; gap: 16px; }
  .band svg { width: 36px; height: 41px; }
  .band b { font: 800 34px/1 var(--display); font-stretch: 80%; letter-spacing: .05em; text-transform: uppercase; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 12px; }
  h1 { margin: 0; text-align: center; font: 800 128px/.9 var(--display); font-stretch: 72%; letter-spacing: -.015em; }
  .addr { position: relative; margin-top: 54px; border: 2px solid var(--ink); border-radius: 3px; padding: 14px 22px 16px; background: var(--label); }
  .caps { font: 700 16px/1.2 var(--display); font-stretch: 88%; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-2); }
  .url { margin-top: 6px; font: 500 27px/1.3 var(--mono); white-space: nowrap; }
  .url mark { background: var(--stamp-wash); color: var(--stamp-text); font-weight: 700; padding: 0 3px; border-radius: 2px; }
  .stamp { position: absolute; right: -44px; top: -52px; transform: rotate(-9deg); border: 6px double var(--stamp); color: var(--stamp-text); background: var(--label);
    border-radius: 8px; padding: .16em .42em .08em; font: 900 46px/1 var(--display); font-stretch: 68%; letter-spacing: .06em; text-transform: uppercase; }
</style></head>
<body>
  <header class="band">
    <svg viewBox="0 0 30 34" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 2 3 6.5v9.2C3 24 8.6 29.6 15 32c6.4-2.4 12-8 12-16.3V6.5L15 2Z"/><path d="M9 17.5l4 4 8-9"/></svg>
    <b>LinkGuard</b>
  </header>
  <main>
    <h1>Is this<br>link safe?</h1>
    <div class="addr">
      <div class="caps">It really goes to</div>
      <div class="url"><mark>paypa1-account-verify.xyz</mark></div>
      <div class="stamp">Not safe</div>
    </div>
  </main>
</body></html>
